stages: [validate, deploy]
validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.16.5
    entrypoint: ['']
  script:
    - python3 tests/test_ci_contract.py
    - terraform fmt -check
    - terraform init -backend=false -input=false
    - terraform validate
    - for script in scripts/*.sh ci/*.sh; do bash -n "$script"; done
  before_script:
    - apk add --no-cache bash python3
manual_deploy:
  stage: deploy
  tags: [homelab]
  resource_group: homelab-deploy
  environment:
    name: homelab
  rules:
    - if: '$DEPLOY_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never
  allow_failure: false
  variables:
    HOMELAB_ACTION: plan
  # Dedicated persistent SHELL runner; Terraform 1.16.5/OpenSSH/Python/flock
  # installed out of band. Never share it with public/untrusted build jobs.
  script:
    - export HOMELAB_STATE_ID="gitlab-$CI_PROJECT_ID"
    - ./ci/deploy.sh
  # Set the same protected variables/secrets documented for GitHub.
  # There are deliberately no state, plan, key cache or artifact uploads.
